<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Pool Estimate</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #0a1628; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    /* Full-width + full-height host: the widget's own shell caps + centers itself
       and fills this height, so it fits the iframe without being cut off. */
    #estimator-widget { width: 100%; height: 100%; padding: 16px; box-sizing: border-box; }
    @media (max-width: 640px) { #estimator-widget { padding: 8px; } }
  </style>
</head>
<body>
  <!-- Estimator Widget -->
  <div
    id="estimator-widget"
    data-key="26920aadc92ed1e98a274fdae4258cc7"
    data-api-url="https://estimatorpro-api-two.vercel.app/api/v1"
  ></div>
  <script>
    // Allow the dashboard "View Estimator" button to pass a specific key via ?key=
    const urlKey = new URLSearchParams(window.location.search).get('key');
    if (urlKey) {
      document.getElementById('estimator-widget').setAttribute('data-key', urlKey);
    }
  </script>
  <script src="/widget.iife.js"></script>
</body>
</html>
